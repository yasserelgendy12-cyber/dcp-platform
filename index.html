<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects Control Platform – منصة التحكم بالمشاريع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2A4A;--navy2:#163A63;--navy3:#1F4C80;--pri:#1D5FA8;--pri-l:#E8F0FA;
  --ink:#16202E;--ink2:#4A5668;--ink3:#7B8698;--line:#E1E6EE;--line2:#EEF1F6;--bg:#F3F5F9;--card:#fff;
  --ok:#0E8A5F;--ok-l:#E3F5EE;--warn:#B76E00;--warn-l:#FFF3DC;--bad:#C62828;--bad-l:#FDE8E8;--info:#2F6FB5;--info-l:#E6F0FB;
  --input:#0B7A4B;--calc:#F4F6F9;--r:10px;--sh:0 1px 2px rgba(16,32,56,.06),0 2px 8px rgba(16,32,56,.05);
  --font:"Inter","Segoe UI","IBM Plex Sans Arabic","Tahoma",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Segoe UI","Tahoma",var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hidden{display:none!important}
.muted{color:var(--ink3)}.small{font-size:12px}.tiny{font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.num{font-variant-numeric:tabular-nums}
/* ---------- layout ---------- */
#app{display:flex;height:100vh;overflow:hidden}
#side{width:248px;flex:0 0 248px;background:var(--navy);color:#C9D6E8;display:flex;flex-direction:column;transition:width .2s}
#side .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#side .brand .t1{color:#fff;font-weight:700;font-size:14px;letter-spacing:.2px;line-height:1.35;text-align:start;unicode-bidi:plaintext;overflow-wrap:anywhere}
html[dir=rtl] #side .brand .t1{text-align:right}
#side .brand .t2{font-size:11.5px;color:#8FA6C4;margin-top:2px}
#side nav{flex:1;overflow:auto;padding:10px 10px}
#side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6F87A8;margin:14px 10px 6px}
html[dir=rtl] #side .grp{letter-spacing:0}
#side .nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#C9D6E8;text-decoration:none;font-size:13px;margin:1px 0}
#side .nv:hover{background:rgba(255,255,255,.06);color:#fff}
#side .nv.on{background:var(--navy3);color:#fff;font-weight:600}
#side .nv svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
#side .nv .lock{margin-inline-start:auto;opacity:.45;width:13px;height:13px}
#side .nv .cnt{margin-inline-start:auto;background:#C62828;color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:600}
#side .foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
#side .foot .who{color:#fff;font-weight:600}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:56px;flex:0 0 56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}
#top .ttl{font-weight:700;font-size:16px}
#top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--line2);font-size:12px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink)}
.chip.co{background:var(--pri-l);color:var(--pri)}.chip.co b{color:var(--navy)}
.chip.sync-ok{background:var(--ok-l);color:var(--ok)}.chip.sync-no{background:var(--warn-l);color:var(--warn)}.chip.sync-err{background:var(--bad-l);color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
#view{flex:1;overflow:auto;padding:20px 22px 40px}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-size:20px;margin:0;font-weight:700;color:var(--navy)}
.page-h .desc{color:var(--ink3);font-size:12.5px;margin-top:3px;max-width:760px}
.page-h .act{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap;transition:.12s}
.btn:hover{border-color:#C5CEDB;background:#FAFBFD}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:#174F8F}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:#F2C4C4}.btn.danger:hover{background:var(--bad-l)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--line2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in,select.in,textarea.in{border:1px solid #D3DAE5;border-radius:7px;padding:6px 9px;background:#fff;min-width:0;outline:none;color:var(--input);font-weight:500}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(29,95,168,.12)}
.in:disabled,.in[readonly]{background:var(--calc);color:var(--ink2);font-weight:400}
.in.err{border-color:var(--bad);background:#FFF7F7}
.in.wrn{border-color:#E7B160;background:#FFFBF2}
select.in{padding-inline-end:24px}
textarea.in{resize:vertical;min-height:62px;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:600}
label.f .in{font-size:13px}
label.f .req{color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px}
.fsec{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin-bottom:12px;background:#fff}
.fsec h4{margin:0 0 10px;font-size:12.5px;color:var(--navy);text-transform:uppercase;letter-spacing:.6px}
html[dir=rtl] .fsec h4{letter-spacing:0}
.calcv{background:var(--calc);border:1px dashed #D3DAE5;border-radius:7px;padding:6px 9px;color:var(--ink2);min-height:32px;font-weight:500}
/* ---------- cards / kpi ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.card .ch h3{margin:0;font-size:13.5px;color:var(--navy)}
.card .cb{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1200px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.g2,.g3,.g4,.g6{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);min-width:0}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[dir=rtl] .kpi .k{letter-spacing:0}
.kpi .v{font-size:21px;font-weight:700;color:var(--navy);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--ink3);margin-top:1px}
.kpi.ok .v{color:var(--ok)}.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
.sec-t{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
html[dir=rtl] .sec-t{letter-spacing:0}
.sec-t:after{content:"";flex:1;height:1px;background:var(--line)}
.bar{height:8px;background:var(--line2);border-radius:5px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--pri);border-radius:5px}
.bar>i.pl{background:#B8C6D9}
.prog-row{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
/* ---------- badges ---------- */
.bdg{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11.2px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--ink2)}
.bdg.ok{background:var(--ok-l);color:var(--ok)}.bdg.bad{background:var(--bad-l);color:var(--bad)}.bdg.warn{background:var(--warn-l);color:var(--warn)}.bdg.info{background:var(--info-l);color:var(--info)}.bdg.navy{background:var(--navy);color:#fff}
/* ---------- tables ---------- */
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbar .in{height:32px}
.tbar .search{min-width:220px}
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--sh);max-height:calc(100vh - 250px)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.t th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;font-weight:600;text-align:start;padding:8px 10px;white-space:nowrap;font-size:11.8px;border-inline-end:1px solid rgba(255,255,255,.08)}
table.t th.srt{cursor:pointer}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
table.t tr:hover td{background:#F8FAFD}
table.t tr.cl{cursor:pointer}
table.t td.wrap{white-space:normal;min-width:220px;max-width:420px}
table.t td.n,table.t th.n{text-align:end;font-variant-numeric:tabular-nums}
table.t td.c{color:var(--ink2);background:#FAFBFC}
table.t tfoot td{position:sticky;bottom:0;background:#EEF2F8;font-weight:700;border-top:1px solid var(--line)}
table.t .stk{position:sticky;inset-inline-start:0;z-index:1;background:#fff}
table.t th.stk{z-index:3;background:var(--navy)}
table.t tr.sel td{background:#EEF5FF}
table.egrid td{padding:3px 5px}
table.egrid .in{padding:4px 6px;height:28px;font-size:12.5px;width:100%}
table.egrid .in.pct{width:66px;text-align:end}
table.egrid .in.dt{width:130px}
table.egrid .in.rd{width:58px;text-align:end}
table.egrid .in.tx{width:170px}
table.egrid tr.beh td.stk{box-shadow:inset 3px 0 0 var(--bad)}
html[dir=rtl] table.egrid tr.beh td.stk{box-shadow:inset -3px 0 0 var(--bad)}
.an{font-weight:600;color:var(--ink);max-width:340px;overflow:hidden;text-overflow:ellipsis;display:block}
.pg{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--ink3)}
.empty{padding:40px;text-align:center;color:var(--ink3)}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs .tb{padding:9px 14px;cursor:pointer;color:var(--ink3);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs .tb.on{color:var(--pri);border-color:var(--pri)}
/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(12,24,44,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.md{background:#fff;border-radius:14px;width:min(980px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.md.sm{width:min(520px,100%)}
.md .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.md .mh h3{margin:0;font-size:15px;color:var(--navy)}
.md .mb{padding:16px 18px;overflow:auto;background:#FBFCFE}
.md .mf{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.md .mf .sp{flex:1}
.x{margin-inline-start:auto;cursor:pointer;border:0;background:none;font-size:20px;color:var(--ink3);line-height:1}
/* ---------- toast ---------- */
#toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
html[dir=rtl] #toast{transform:translateX(50%)}
.tst{background:var(--navy);color:#fff;padding:9px 16px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px;max-width:560px}
.tst.bad{background:var(--bad)}.tst.ok{background:var(--ok)}.tst.warn{background:var(--warn)}
/* ---------- login ---------- */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0B2240 0%,#163A63 55%,#1F4C80 100%);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;z-index:40}
.lg{background:#fff;border-radius:16px;width:min(880px,100%);display:grid;grid-template-columns:1fr 1.15fr;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lg .l{background:var(--navy);color:#C9D6E8;padding:30px 28px;display:flex;flex-direction:column;gap:14px}
.lg .l h2{color:#fff;margin:0;font-size:21px;line-height:1.3}
.lg .l .ft{font-size:12.5px;line-height:1.6}
.lg .l .ft div{display:flex;gap:8px;margin:6px 0}
.lg .l .ft svg{width:16px;height:16px;flex:0 0 16px;color:#7FB3F0;margin-top:2px}
.lg .r{padding:28px}
.lg .r h3{margin:0 0 4px;color:var(--navy)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.role{border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.role b{font-size:12.8px;color:var(--ink)}
.role span{font-size:11px;color:var(--ink3)}
.role.on{border-color:var(--pri);background:var(--pri-l);box-shadow:0 0 0 2px rgba(29,95,168,.15)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
.lang button.on{background:var(--navy);color:#fff}
@media(max-width:780px){.lg{grid-template-columns:1fr}.lg .l{display:none}#side{width:64px;flex-basis:64px}#side .nv span,#side .grp,#side .brand .t2,#side .brand .t1,#side .foot .x2{display:none}}
/* ---------- misc ---------- */
.steps{counter-reset:s}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}
.step:last-child{border:0}
.step .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 30px;background:var(--pri-l);color:var(--pri)}
.step .ic svg{width:16px;height:16px}
.step .bd{flex:1;min-width:0}
.step .bd b{display:block;font-size:13px}
.step .bd span{font-size:12px;color:var(--ink3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-weight:600}
.notice{border-radius:9px;padding:10px 14px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.notice svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px}
.notice.info{background:var(--info-l);color:#1C4E86}.notice.warn{background:var(--warn-l);color:#7A4A00}.notice.bad{background:var(--bad-l);color:#8E1C1C}.notice.ok{background:var(--ok-l);color:#0A5F42}
.logos{display:flex;gap:10px;align-items:center}
.logos img{height:34px;max-width:90px;object-fit:contain;background:#fff;border-radius:6px;padding:3px;border:1px solid var(--line)}
.drop{border:2px dashed #C9D3E1;border-radius:12px;padding:22px;text-align:center;color:var(--ink3);cursor:pointer;background:#FAFBFD}
.drop:hover,.drop.ov2{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.mpgrid td.rn{min-width:260px;white-space:normal}
.mpgrid .in{width:72px;text-align:end}
.mpgrid tr.gh td{background:#EEF2F8;font-weight:700;color:var(--navy);position:sticky;top:33px;z-index:1}
.pill-sel{display:flex;gap:6px;flex-wrap:wrap}
.pill-sel .bdg{cursor:pointer;padding:4px 10px;font-size:12px}
.pill-sel .bdg.on{background:var(--navy);color:#fff}
.flag{display:inline-flex;gap:3px}
.flag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.bulk{position:sticky;bottom:0;background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
.bulk .in{height:30px}
@media print{#side,#top .act,.tbar,.pg{display:none}#view{overflow:visible}}
.ch>svg,.cb>svg{width:18px;height:18px;flex:0 0 18px;color:var(--pri)}
.drop svg{width:26px;height:26px}
.tbar label svg,.kv svg{width:15px;height:15px}
.in::placeholder{color:#B3BCCA;font-weight:400;font-style:italic}
select.fsel{field-sizing:content;min-width:150px;max-width:380px}
select.fsel.on{border-color:var(--pri);background:var(--pri-l);color:var(--navy);font-weight:600;box-shadow:0 0 0 2px rgba(29,95,168,.12)}

.bdg>svg{width:12px;height:12px;vertical-align:-2px;margin-inline-end:3px}

.sigbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;direction:ltr;font-size:11px;line-height:1.3}
.sigc{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:#fff;text-decoration:none;white-space:nowrap}
.sigc svg{width:12px;height:12px;flex:0 0 12px}.sigc.nm{color:var(--ink);font-weight:600}a.sigc:hover{border-color:var(--pri);color:var(--pri)}
.sigcp{color:var(--ink3)}
#sig{padding:7px 22px 8px;border-top:1px solid var(--line);background:var(--card)}
.sigbar.dk .sigc{background:transparent;border-color:#3E5F8A;color:#C9D6E8}.sigbar.dk .sigc.nm{border-color:#7FB3F0;color:#fff}.sigbar.dk a.sigc.ln{color:#7FB3F0}.sigbar.dk .sigcp{color:#8FA6C4}
@media print{#sig{display:none}}

.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1200px){.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.g5{grid-template-columns:1fr 1fr}}
.kc .kpi{padding:8px 12px}.kc .kpi .v{font-size:18px;margin-top:1px}
.in.need{border-color:var(--ok);background:var(--ok-l);box-shadow:inset 0 0 0 1px var(--ok)}
/* progress page: KPI row (contractor figure dominant, consultant / owner smaller in one colour, planned with two figures) */
.pk{display:grid;grid-template-columns:.9fr 1.45fr 1.2fr 1.3fr .85fr .85fr;gap:12px;align-items:stretch}
@media(max-width:1250px){.pk{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.pk{grid-template-columns:1fr 1fr}}
.pk .kpi{padding:9px 13px}.pk .kpi .v{font-size:19px;margin-top:1px}
.kpi.main{border:2px solid var(--pri);background:var(--pri-l);display:flex;flex-direction:column;justify-content:center}.pk .kpi.main .v{font-size:30px;line-height:1.15}.kpi.main .k{color:var(--navy);font-size:12px}
.kpi.pl2 .bas{font-size:10px;font-weight:600;background:var(--line2);color:var(--ink2);border-radius:9px;padding:1px 7px;margin-inline-start:4px;text-transform:none;letter-spacing:0}
.kpi.pl2 .plr{display:flex;align-items:baseline;gap:8px;margin-top:4px;white-space:nowrap}.kpi.pl2 .plr b{font-size:17px;color:var(--navy);font-variant-numeric:tabular-nums;min-width:66px}.kpi.pl2 .plr span{font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis}
.kpi.pl2 .plr+.plr{border-top:1px dashed var(--line);padding-top:4px}
.revs{display:grid;grid-template-rows:1fr 1fr;gap:6px;min-width:0}
.pk .kpi.mini{padding:4px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;box-shadow:none;background:#FAFBFD}

.gb-t{position:relative;height:16px;background:#F4F0EA;border-radius:4px}.gb-t i{position:absolute;top:0;bottom:0;background:#5B4444;border-radius:4px}
.gb-d{font-size:11px;color:#7A706C}
.t.dl td{vertical-align:top}.t.dl .tiny{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6B6360}
.hs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;overflow:auto}
.hs-r{display:flex;justify-content:space-between;gap:10px;padding:6px 4px;border-bottom:1px solid #F1ECE4;font-size:13px}.hs-r b{font-size:14px}
.sm{position:relative;height:100%;background:#EDE8E0}
.sm-v{position:absolute;inset:0}.sm-v canvas{display:block;cursor:grab}
.sm-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#5E5552}
.sm-hud{position:absolute;top:16px;inset-inline-start:16px;background:rgba(255,255,255,.92);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:250px;box-shadow:0 4px 18px rgba(40,25,25,.12)}
.sm-t{font-weight:700;color:#5B4444;font-size:18px}.sm-d{font-size:22px;font-weight:700}
.sm-k{display:flex;gap:16px}.sm-k div{display:flex;flex-direction:column}.sm-k span{font-size:11.5px;color:#7A706C}.sm-k b{font-size:20px}
.sm-lg{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:#4A4442}.sm-lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-2px}
.sm-bar{position:absolute;inset-inline:16px;bottom:14px;background:rgba(255,255,255,.94);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(40,25,25,.12)}
.sm-bar input[type=range]{flex:1;accent-color:#5B4444}
.sm-bar .seg{display:flex;border:1px solid #DDD5C9;border-radius:8px;overflow:hidden}.sm-bar .seg button{border:0;background:#fff;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;color:#4A4442}.sm-bar .seg button.on{background:#5B4444;color:#fff}
/* report print: one A4 landscape sheet per page */
#rpPrint{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  body.printing>*:not(#rpPrint){display:none!important}
  body.printing #rpPrint{display:block}
  .rpp{width:297mm;height:210mm;box-sizing:border-box;padding:6mm 8mm;display:flex;flex-direction:column;gap:3mm;page-break-after:always;break-after:page;overflow:hidden;background:#fff}
  .rpp:last-child{page-break-after:auto;break-after:auto}
  .rpp header{display:flex;gap:6mm;align-items:baseline;font-size:9pt;color:#5B4444;border-bottom:.4mm solid #AF9F58;padding-bottom:1.5mm}.rpp header b{font-size:11pt;flex:1}
  .rpp .rp-page{zoom:.86;box-shadow:none;transform:none!important;margin:0 auto;flex:0 0 auto}
  .rpp footer{font-size:7pt;color:#7A706C;text-align:center;margin-top:auto}
  .rpp .np{pointer-events:none}.rpp .up-tw,.rpp .hb,.rpp .gb{overflow:hidden!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

        wbs: wbsPath(t.wbs_id),
        wbsName: (wbs[t.wbs_id] || {}).wbs_name || '',

        pctType: t.complete_pct_type,

        pct: r2(pct),
        od: r2(od),

        rdHr,
        hr,
        as: d10(t.act_start_date),
        af: d10(t.act_end_date),
        ps: d10(t.target_start_date),
        pf: d10(t.target_end_date),
        es: d10(t.early_start_date || t.restart_date),
        ef: d10(t.early_end_date || t.reend_date),
        tf: t.total_float_hr_cnt === '' ? null : r2(num(t.total_float_hr_cnt) / hr),

        codes: tcodes[t.task_id] || {}

    return {
      fileName: fileName || '',
      projShort: proj.proj_short_name || '',
      projName: (root.wbs_name || '').trim(),
      calName: (calRec.clndr_name || '').trim(),
      dayHr: defHr,
      wbsCount: Object.values(wbs).filter(w => w.proj_id === projId).length,
      relCount: recs(T, 'TASKPRED').filter(r => !r.proj_id || r.proj_id === projId).length,
      labUnits: r2(labUnits),
      currency: hdr[0] === 'ERMHDR' && hdr.length >= 9 ? hdr[hdr.length - 1] : '',

      planEnd: d10(proj.scd_end_date || proj.plan_end_date),
      mustFinish: d10(proj.plan_end_date),
      exportDate: (text.slice(0, 200).split('\t')[2] || '').trim(),
      codeTypes,
      activities: acts
    };
  }

})();

/* drawings summary aggregation (cached per render) */
let _tgtCache = null;
function tgtAgg(t) {
  if (!_tgtCache) _tgtCache = new Map();
  const key = `${t.phase}|${t.zone}|${t.element}|${t.designPlanned}|${t.designOpening}|${t.shopPlanned}|${t.shopOpening}`;
  if (_tgtCache.has(key)) return _tgtCache.get(key);
  const P = S.db.params; const logs = live(S.db.drawings).filter(r => r.no && r.phase === t.phase && r.zone === t.zone && r.element === t.element);
  const des = logs.filter(r => r.category === 'Design Drawing'), shop = logs.filter(r => r.category === 'Shop Drawing');
  const dT = Math.max(N(t.designPlanned), N(t.designOpening) + des.length), sT = Math.max(N(t.shopPlanned), N(t.shopOpening) + shop.length);
  const dS = N(t.designOpening) + des.filter(r => r.actualSub).length, sS = N(t.shopOpening) + shop.filter(r => r.actualSub).length;
  const cr = r => MOD.drawings.F.credit.calc(r);
  const dP = dT ? (N(t.designOpening) * N(P.creditURDesign) + sum(des, cr)) / dT : 0;
  const sP = sT ? (N(t.shopOpening) * N(P.creditURShop) + sum(shop, cr)) / sT : 0;
  const cnt = c => logs.filter(r => r.reviewCode === c).length;
  const UR = N(t.designOpening) + N(t.shopOpening) + logs.filter(r => ['Under Review', 'Overdue Review'].includes(MOD.drawings.F.status.calc(r))).length;
  const wD = N(P.designWeight) * (dT > 0), wS = N(P.shopWeight) * (sT > 0);
  const O = (wD + wS) ? (wD * dP + wS * sP) / (wD + wS) : 0;
  const res = { dT, sT, dS, sS, dP, sP, A: cnt('Code A'), B: cnt('Code B'), C: cnt('Code C'), Dd: cnt('Code D'), UR, O };
  _tgtCache.set(key, res); return res;
}

/* ===== PROGRESS ENGINE ===== */
const PROG = {
  acts: () => { const m = SCH(); return m ? m.activities : []; },
  upd: cid => (cid && S.db.updates[cid]) || {},
  // baseline dates of an activity (from the baseline XER); null when the activity is not in the baseline
  blDates: a => a.bl ? { s: a.bl.ps || a.bl.es || '', f: a.bl.pf || a.bl.ef || '', od: a.bl.od } : null,
  // dates the plan % is measured on: parameter planBasis = 'bl' (baseline XER dates where available – default) or 'upd' (planned dates of the latest update XER)
  planBasis: () => (S.db.params.planBasis === 'upd' ? 'upd' : 'bl'),
  planDates(a) { const b = PROG.planBasis() === 'bl' ? PROG.blDates(a) : null; return (b && b.s && b.f) ? b : { s: a.ps, f: a.pf }; },
  // planned fraction (0–1) at the end of a day, counted like P6 "Schedule % Complete": days elapsed incl. that day / duration in days
  planRaw(a, date) {
    const { s, f } = PROG.planDates(a);
    if (!s || !f || !date) return null;
    if (date < s) return 0; if (date >= f) return 1;
    return (D.diff(date, s) + 1) / (D.diff(f, s) + 1);
  },
  planned(a, date) { const x = PROG.planRaw(a, date); return x === null ? null : Math.round(x * 1000) / 10; },
  // who updated an activity in a cut-off: contractor fields / consultant review / owner review
  byC: u => !!u && ['ctr', 'as', 'af', 'rd', 'causedBy', 'reason', 'mitigation'].some(k => u[k] !== undefined && u[k] !== ''),
  byCo: u => !!u && isNum(u.cons), byO: u => !!u && isNum(u.own),
  isMs: a => a.type === 'TT_Mile' || a.type === 'TT_FinMile',
  eff(a, u) {
    u = u || {};
    const hasIn = isNum(u.ctr);
    let pct = Math.max(N(a.pct), hasIn ? N(u.ctr) : 0);
    if (PROG.isMs(a) && pct > 0) pct = 100;
    pct = Math.min(100, Math.max(0, pct));
    const status = pct <= 0 ? 'Not Started' : pct < 100 ? 'In Progress' : 'Completed';
    let as = status === 'Not Started' ? '' : (u.as || a.as || '');
    let af = status === 'Completed' ? (u.af || a.af || '') : '';
    let rd;
    if (status === 'Completed') rd = 0;
    else if (isNum(u.rd)) rd = Math.round(N(u.rd));
    else if (status === 'In Progress' && a.status === 'In Progress' && Math.abs(pct - N(a.pct)) < 0.01) rd = Math.ceil(N(a.rd) - 1e-9);
    else if (status === 'In Progress') rd = Math.max(1, Math.ceil(N(a.od) * (1 - pct / 100) - 1e-9));
    else rd = Math.ceil(N(a.rd) - 1e-9);
    if (a.type === 'TT_Mile') { af = ''; if (status === 'Completed' && !as) as = u.af || a.af || ''; }
    if (a.type === 'TT_FinMile') { if (status === 'Completed' && !af) af = as; as = ''; }
    const p6 = PROG.p6(a);
    const changed = p6.status !== status || p6.pct !== Math.round(pct) || p6.as !== as || p6.af !== af || p6.rd !== rd;
    return { pct, pctR: Math.round(pct), status, as, af, rd, changed, hasIn };
  },
  p6(a) { // what P6 currently holds, formatted like the export
    const st = a.status, ms = PROG.isMs(a);
    return { status: st, pct: Math.round(N(a.pct)), as: (a.type === 'TT_FinMile' || st === 'Not Started') ? '' : (a.as || ''), af: (a.type === 'TT_Mile' || st !== 'Completed') ? '' : (a.af || ''), rd: st === 'Completed' ? 0 : Math.ceil(N(a.rd) - 1e-9), ms };
  },
  issues(a, u, e, cut) {
    const out = []; u = u || {};
    const add = (k, sev, f) => out.push({ k, sev, f });
    ['ctr', 'cons', 'own'].forEach(f => { if (isNum(u[f]) && (N(u[f]) < 0 || N(u[f]) > 100)) add('v_range', 'bad', f); });
    if (isNum(u.ctr) && N(u.ctr) < N(a.pct) - 0.01) add('v_lower', 'warn', 'ctr');
    if (e.status !== 'Not Started' && !e.as && a.type !== 'TT_FinMile') add('v_as', 'bad', 'as');
    if (e.status === 'Completed' && !e.af && a.type !== 'TT_Mile') add('v_af', 'bad', 'af');
    if (u.af && e.status !== 'Completed') add('v_af_np', 'bad', 'af');
    if (u.as && e.status === 'Not Started') add('v_as_np', 'bad', 'as');
    if (isNum(u.rd) && e.status !== 'In Progress') add('v_rd_np', 'warn', 'rd');
    if (e.as && e.af && e.af < e.as) add('v_order', 'bad', 'af');
    if (cut && ((u.as && u.as > cut) || (u.af && u.af > cut))) add('v_future', 'bad', u.af && u.af > cut ? 'af' : 'as');
    if (isNum(u.rd) && (N(u.rd) <= 0 || N(u.rd) !== Math.round(N(u.rd))) && e.status === 'In Progress') add('v_rd', 'bad', 'rd');
    const c = e.pct; if ((isNum(u.cons) && N(u.cons) > c + 0.01) || (isNum(u.own) && N(u.own) > c + 0.01)) add('v_rev', 'warn', isNum(u.cons) && N(u.cons) > c ? 'cons' : 'own');
    const pl = PROG.planned(a, cut); if (pl !== null && e.status !== 'Completed' && pl > e.pct + 0.5 && !(u.reason && u.causedBy)) add('v_reason', 'warn', 'reason');
    return out;
  },
  rows(cid) {
    const cut = (S.db.cutoffs.find(c => c._id === cid) || {}).date || reportDate();
    const U = PROG.upd(cid);
    return PROG.acts().map(a => { const u = U[a.id]; const e = PROG.eff(a, u); const pl = PROG.planned(a, cut); return { a, u, e, pl, behind: pl !== null && e.status !== 'Completed' && pl > e.pct + 0.5, iss: PROG.issues(a, u, e, cut) }; });
  },
  weights() { const acts = PROG.acts(); const tc = sum(acts, a => a.cost); return { tc, w: a => tc > 0 ? N(a.cost) / tc : (N(a.od) / (sum(acts, x => x.od) || 1)) }; },
  summary(cid) {
    const rows = PROG.rows(cid); const { w } = PROG.weights();
    const m = SCH() || {}, cdate = (S.db.cutoffs.find(c => c._id === cid) || {}).date || reportDate(), ddate = m.asOf || m.dataDate || '';   // plan at the cut-off date and at the P6 data date of the latest XER
    // consultant: own review where given, else the P6 %. Owner: owner entries only – an activity the owner has not entered counts 0 (decision 11-Nov-2026)
    let pl = 0, plD = 0, ctr = 0, cons = 0, own = 0, hasOwn = false;
    rows.forEach(r => { const wt = w(r.a); pl += wt * N(PROG.planRaw(r.a, cdate)); if (ddate) plD += wt * N(PROG.planRaw(r.a, ddate)); ctr += wt * r.e.pct / 100; const u = r.u || {}; cons += wt * (isNum(u.cons) ? N(u.cons) : N(r.a.pct)) / 100; if (isNum(u.own)) hasOwn = true; own += wt * (isNum(u.own) ? N(u.own) : 0) / 100; });
    const c = s => rows.filter(r => r.e.status === s).length;
    return { rows, planned: pl, plannedDD: ddate ? plD : null, cdate, ddate: m.dataDate || '', basis: PROG.planBasis() === 'bl' && m.bl ? 'bl' : 'upd', ctr, cons, own, hasOwn, n: rows.length, comp: c('Completed'), inprog: c('In Progress'), ns: c('Not Started'), behind: rows.filter(r => r.behind).length, behindNoReason: rows.filter(r => r.behind && !(r.u && r.u.reason)).length, updated: rows.filter(r => r.u && Object.keys(r.u).some(k => !k.startsWith('_'))).length, updC: rows.filter(r => PROG.byC(r.u)).length, updCo: rows.filter(r => PROG.byCo(r.u)).length, updO: rows.filter(r => PROG.byO(r.u)).length, changed: rows.filter(r => r.e.changed).length, bad: rows.filter(r => r.iss.some(i => i.sev === 'bad')).length };
  }
};

function fmtVal(f, v, r) {

async function importXER(file, kind) { // kind: 'baseline' (approved baseline schedule) | 'update' (latest progress update, default)
  const isBl = kind === 'baseline';
  try {
    toast(LBL('Reading XER…', 'جارٍ قراءة ملف XER…'));
    const buf = await file.arrayBuffer(); const sch = XER.parse(XER.decode(buf), file.name);
    if (!sch.activities.length) throw new Error('No activities');
    const other = isBl ? S.db.schedule : S.db.baseline;
    if (other) { const ids = new Set(other.activities.map(a => a.id)); const common = sch.activities.filter(a => ids.has(a.id)).length; if (common < Math.min(ids.size, sch.activities.length) * 0.3 && !(await confirmBox(T('xer_mismatch').replace('{n}', fmtN(common)), T('pf_use_anyway'), true))) return; }
    if (isBl) { const prog = sch.activities.filter(a => a.status !== 'Not Started').length; if (prog && !(await confirmBox(T('xer_bl_prog').replace('{n}', fmtN(prog)), T('pf_use_anyway')))) return; }
    else if (S.db.schedule && sch.dataDate < S.db.schedule.dataDate && !(await confirmBox(T('xer_older'), 'OK'))) return;
    sch.importedAt = nowISO(); sch.importedBy = S.user.name; packSched(sch);
    const ent = x => ({ fileName: x.fileName, dataDate: x.dataDate, n: x.activities.length, at: x.importedAt, by: x.importedBy });
    const old = isBl ? S.db.baseline : S.db.schedule;
    sch.history = [...((old && (old.history || [ent(old)])) || []), ent(sch)].slice(-60);   // register of the files loaded so far
    if (isBl) S.db.baseline = sch;
    else { S.db.schedule = sch; const cut = activeCutoff(); if (cut) { const c = S.db.cutoffs.find(x => x._id === cut._id); c.dataDate = sch.dataDate; c.xer = sch.fileName; stamp(c); } }
    // project data found in the XER fills Project setup only where it is still empty
    const xi = xerInfo(), p = S.db.project, fill = {}; if (!p.name && xi.projName) fill.name = xi.projName; if (!p.commencement && xi.planStart) fill.commencement = xi.planStart; if (!p.completion && (xi.mustFinish || xi.planEnd)) fill.completion = xi.mustFinish || xi.planEnd;
    if (Object.keys(fill).length) S.db.project = stamp(Object.assign(clone(p), fill));
    touch(isBl ? 'import baseline XER' : 'import XER', `${file.name} (${sch.activities.length})`); toast(`${T(isBl ? 'xer_bl_loaded' : 'xer_loaded')}: ${sch.activities.length} ${T('activities')} · ${D.fmt(sch.dataDate)}`, 'ok'); render(true);
  } catch (e) { toast('XER: ' + e.message, 'bad'); }
}

/* ---------- SHA-256 (crypto.subtle, with a pure-JS fallback) ---------- */
const SHA256 = (() => {
  const K = new Uint32Array([0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  function js(bytes) {
    const l = bytes.length, nb = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(nb); m.set(bytes); m[l] = 0x80;
    const dv = new DataView(m.buffer); dv.setUint32(nb - 4, l * 8); dv.setUint32(nb - 8, Math.floor(l / 0x20000000));
    const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]); const W = new Uint32Array(64);
    const r = (x, n) => (x >>> n) | (x << (32 - n));
    for (let o = 0; o < nb; o += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) { const s0 = r(W[i - 15], 7) ^ r(W[i - 15], 18) ^ (W[i - 15] >>> 3), s1 = r(W[i - 2], 17) ^ r(W[i - 2], 19) ^ (W[i - 2] >>> 10); W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0; }
      let [a, b, c, d, e, f, g, hh] = H;
      for (let i = 0; i < 64; i++) { const t1 = (hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) >>> 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0; hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0; }
      H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += hh;
    }
    return Array.from(H).map(x => x.toString(16).padStart(8, '0')).join('');
  }
  return async str => {
    const bytes = new TextEncoder().encode(str);
    try { if (crypto && crypto.subtle) return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))).map(b => b.toString(16).padStart(2, '0')).join(''); } catch (e) { }

  };
})();

/* compress an uploaded image (logo / project cover) before it is stored in the database */
function imgData(file, max, type) {
  return new Promise((res, rej) => { const rd = new FileReader(); rd.onerror = rej; rd.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const x = c.getContext('2d'); if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); } x.drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL(type, 0.78)); }; im.src = rd.result; }; rd.readAsDataURL(file); });
}

  if (!todo.length && !gone.length) { if (verbose) toast(LBL('Update history is up to date', 'سجل التحديثات محدّث'), 'ok'); return; }
  SRC.busy = true;
  try {
    let i = 0; toast(LBL(`Reading ${todo.length} update file(s)…`, `قراءة ${todo.length} ملف تحديث…`)); for (const f of todo) { i++; const pe = document.querySelector('[data-xprog]'); if (pe) pe.textContent = `${LBL('Reading', 'قراءة')} ${f.name} (${i}/${todo.length})…`;
      const sch = XER.parse(XER.decode(await f.buf()), f.name); if (!sch.activities.length) continue; known.set(f.name, xerSummary(sch, f)); await new Promise(r => setTimeout(r, 0)); }

/* ---------- small SVG line chart (x = dates) ---------- */

  const months = []; let m = x0.slice(0, 8) + '01'; while (m <= x1) { if (m >= x0) months.push(m); const [y, mm] = m.split('-').map(Number); m = mm === 12 ? `${y + 1}-01-01` : `${y}-${String(mm + 1).padStart(2, '0')}-01`; }
  const step = Math.ceil(months.length / 9);
  const xt = months.filter((_, i) => i % step === 0).map(d => `<line x1="${X(d)}" x2="${X(d)}" y1="${h - B}" y2="${h - B + 4}" stroke="#B9AFA6"/><text x="${X(d)}" y="${h - B + 17}" text-anchor="middle" font-size="11" fill="#7A706C">${D.fmt(d).slice(3)}</text>`).join('');
  const ser = series.map(s => `<polyline fill="none" stroke="${s.color}" stroke-width="${s.wd || 2.5}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} points="${s.pts.map(([d, v]) => `${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}"/>${s.marks ? s.pts.map(([d, v]) => `<circle cx="${X(d).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.6" fill="#fff" stroke="${s.color}" stroke-width="2"/>`).join('') : ''}`).join('');
  const vl = vline ? `<line x1="${X(vline)}" x2="${X(vline)}" y1="${T}" y2="${h - B}" stroke="#C8313F" stroke-dasharray="4 4"/><text x="${X(vline) + 4}" y="${T + 10}" font-size="11" fill="#C8313F">${D.fmt(vline)}</text>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"><line x1="${L}" x2="${w - R}" y1="${h - B}" y2="${h - B}" stroke="#B9AFA6"/>${grid}${xt}${vl}${ser}</svg>`;
}
const blCurve = () => { // baseline planned % per week (cost weights of the baseline, else durations)
  const acts = ((S.db.baseline || S.db.schedule || {}).activities) || []; if (!acts.length) return [];
  const useCost = acts.some(a => N(a.cost) > 0); const ws = acts.map(a => useCost ? N(a.cost) : N(a.od)); const W = ws.reduce((x, y) => x + y, 0) || 1;

};

function svgCols({ w, h: hh, cats, bars = [], lines = [], fmt = v => fmtN(v), yMax }) { // columns (+ lines) over categories

  el.querySelector('.rs-g').insertAdjacentHTML('afterend', `<div class="rs-c" style="margin-top:14px"><div class="rs-h"><b>${LBL('4D model of the project', 'موديل 4D للمشروع')}</b><span class="muted small">${LBL('Prepared once per project (site, zones, buildings and the rules linking activities to building · level · element). The simulation then follows the database.', 'يُعد مرة واحدة لكل مشروع (الموقع، المناطق، المباني، وقواعد ربط الأنشطة بالمبنى · الدور · العنصر). بعدها تتبع المحاكاة قاعدة البيانات.')}</span></div>
    <div class="rs-s">${ic(M ? 'ok' : 'warn')}<div><b>${M ? `${h(M.project || '')} · ${Object.keys(M.buildings || {}).length} ${LBL('buildings', 'مبنى')} · ${Object.keys(M.zones || {}).length} ${LBL('zones', 'منطقة')}` : LBL('No model imported', 'لم يُستورد موديل')}</b>${M ? `<span class="small muted">${h(M.preparedBy || '')} · ${h(M.preparedAt || '')}${SIM.prepare() ? ` · ${LBL('linked activities', 'أنشطة مرتبطة')}: ${fmtN(sum(SIM.prepare().cells, c => c.items.length))}` : ''}</span>` : ''}</div></div>
    <div class="rs-a"><button class="btn sm pri" data-m4i>${ic('up')}${LBL('Import model (.json)', 'استيراد الموديل (.json)')}</button><input type="file" accept=".json" hidden data-m4f>${M ? `<button class="btn sm" data-m4x>${ic('dl')}${LBL('Download model', 'تنزيل الموديل')}</button><button class="btn sm ghost danger" data-m4r>${ic('x')}${LBL('Remove', 'إزالة')}</button>` : ''}</div></div>`);
  const f = el.querySelector('[data-m4f]'); el.querySelector('[data-m4i]').onclick = () => f.click();
  f.onchange = async () => { try { const m = JSON.parse(await f.files[0].text()); if (!m.site || !m.buildings || !m.map) throw new Error(LBL('Not a 4D model file', 'ليس ملف موديل 4D')); if (m.project && m.project !== S.db.id && !(await confirmBox(`${LBL('This model is for', 'هذا الموديل لمشروع')} <b>${h(m.project)}</b> – ${LBL('use it for', 'استخدامه لمشروع')} <b>${h(S.db.id)}</b>?`, LBL('Use', 'استخدام')))) return; S.db.model4d = stamp(m); touch('4D model imported', m.project || ''); toast(T('saved'), 'ok'); RP.render(); } catch (e) { toast(e.message, 'bad'); } };
  const x = el.querySelector('[data-m4x]'); if (x) x.onclick = () => { const a = document.createElement('a'); const m = { ...S.db.model4d }; delete m._at; delete m._by; a.href = URL.createObjectURL(new Blob([JSON.stringify(m, null, 1)], { type: 'application/json' })); a.download = `${S.db.id}_4D_Model.json`; a.click(); };
  const r = el.querySelector('[data-m4r]'); if (r) r.onclick = async () => { if (await confirmBox(LBL('Remove the 4D model?', 'إزالة موديل 4D؟'), LBL('Remove', 'إزالة'), true)) { S.db.model4d = stamp({ removed: true }); touch('4D model removed'); RP.render(); } };
}; }

/* ===== PRINT / PDF: every report page the user may open, one A4 landscape sheet each (the 4D page as a still at the data date) ===== */
RP.print = async () => {
  if (RP.printing) return; RP.printing = true; toast(LBL('Preparing the report for printing…', 'جارٍ تجهيز التقرير للطباعة…'));
  const pgs = RP.pages().filter(p => !p.admin), cut = rpCut(), p = S.db.project; const code = (p.reportPrefix || '').replace(/\d{3}$/, '') + String((cut && cut.reportNo) || '').padStart(3, '0');
  const box = document.createElement('div'); box.id = 'rpPrint'; box.dir = document.documentElement.dir; document.body.appendChild(box);
  try {
    let n = 0;
    for (const pg of pgs) { n++;
      const sh = document.createElement('section'); sh.className = 'rpp'; sh.innerHTML = `<header><b dir="auto">${h(projTitle(p))}</b><span dir="ltr">${h(code)}</span><span>${rpLbl(pg)}</span><span dir="ltr">${n} / ${pgs.length}</span></header><div class="rp-page"></div><footer dir="ltr">${h(sigLine())}</footer>`; box.appendChild(sh);
      const el = sh.querySelector('.rp-page');
      if (pg.k === 'sim4d') { await RP.print4d(el, pg); continue; }
      try { await (RP.P[pg.k] || RP.P._plan)(el, pg); } catch (e) { el.innerHTML = `<div class="rp-ph"><div class="rp-phs">${h(e.message)}</div></div>`; }
      el.querySelectorAll('select,button,input').forEach(x => x.classList.add('np'));
    }
    await Promise.race([Promise.all([...box.querySelectorAll('img')].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; }))), new Promise(r => setTimeout(r, 8000))]);
    document.body.classList.add('printing'); await new Promise(r => setTimeout(r, 300));
    window.print();
  } finally { document.body.classList.remove('printing'); box.remove(); RP.printing = false; }
};
RP.print4d = async (el, pg) => { // still image of the model at the data date (actual / forecast)
  const P = M4() ? SIM.prepare() : null; if (!P) { RP.P._plan(el, pg); return; }
  try { const T3 = await SIM.lib(); const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-3000px;top:0;width:1280px;height:720px'; document.body.appendChild(host);
    const V = SIM.build(T3, P, host); const s = SIM.state(P, P.dd, 'act'); V.paint(s.st, 'act'); const url = V.canvas.toDataURL('image/jpeg', 0.9); host.remove();
    el.innerHTML = `<div class="sm"><img src="${url}" alt="" style="width:100%;height:100%;object-fit:cover"><div class="sm-hud"><div class="sm-t">${LBL('4D simulation', 'محاكاة 4D')}</div><div class="sm-d"><bdi>${D.fmt(P.dd)}</bdi> · ${T('data_date')}</div><div class="sm-k"><div><span>${LBL('Planned', 'المخطط')}</span><b dir="ltr">${fmtPct(s.pl)}</b></div><div><span>${LBL('Actual', 'الفعلي')}</span><b dir="ltr">${fmtPct(s.ac)}</b></div></div></div></div>`;
  } catch (e) { RP.P._plan(el, pg); }
};
